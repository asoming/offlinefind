name: Desktop acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/*acceptance*'
      - 'src/shiwen/desktop.py'
      - '.github/workflows/acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - name: Linux native runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb openbox
          /usr/bin/python3 -m venv .venv --system-site-packages
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/acceptance_benchmark.py acceptance --documents 1000 --metadata 100000
      - name: Linux desktop interaction and process-tree memory
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' sh -c 'openbox >/tmp/openbox.log 2>&1 & python scripts/desktop_acceptance.py acceptance --existing-index'
      - name: Windows/macOS desktop interaction and process-tree memory
        if: runner.os != 'Linux'
        run: python scripts/desktop_acceptance.py acceptance --existing-index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            acceptance/report.json
            acceptance/desktop-report.json
            acceptance/desktop-*.png
          if-no-files-found: warn

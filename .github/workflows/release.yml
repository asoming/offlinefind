name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: shiwen-${{ matrix.label }}
          path: |
            dist/Shiwen-*.zip
            dist/Shiwen-*.sha256
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop runtime and packaging tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0
          gir1.2-webkit2-4.1 xdg-utils desktop-file-utils xvfb
      - run: /usr/bin/python3 -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pytest -q
      - run: xvfb-run -a .venv/bin/python scripts/package.py
      - name: Test installed Debian package
        run: |
          sudo apt-get install -y ./dist/Shiwen-*-linux-amd64.deb
          shiwen --self-test /tmp/shiwen-deb-core.json
          timeout 90s xvfb-run -a shiwen --gui-smoke /tmp/shiwen-deb-gui.json --data-dir /tmp/shiwen-deb-data
          timeout 90s xvfb-run -a shiwen --gui-close-smoke /tmp/shiwen-deb-close.json --data-dir /tmp/shiwen-deb-data
          /usr/bin/python3 -c "import json,time; r=json.load(open('/tmp/shiwen-deb-close.json')); assert r['ok'] and time.monotonic()-r['close_requested_at']<15"
          /usr/bin/python3 -c "import json; assert all(json.load(open('/tmp/shiwen-deb-' + k + '.json'))['ok'] for k in ['core', 'gui'])"
      - uses: actions/upload-artifact@v4
        with:
          name: shiwen-linux-x64
          path: |
            dist/Shiwen-*.deb
            dist/Shiwen-*.tar.gz
            dist/Shiwen-*.sha256
          if-no-files-found: error
  linux-compatibility:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shiwen-linux-x64
      - name: Install package on Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y ./Shiwen-*-linux-amd64.deb xvfb
      - name: Check core and native desktop bridge
        run: |
          shiwen --self-test /tmp/shiwen-core.json
          timeout 90s xvfb-run -a shiwen --gui-smoke /tmp/shiwen-gui.json --data-dir /tmp/shiwen-data
          timeout 90s xvfb-run -a shiwen --gui-close-smoke /tmp/shiwen-close.json --data-dir /tmp/shiwen-data
          /usr/bin/python3 -c "import json,time; r=json.load(open('/tmp/shiwen-close.json')); assert r['ok'] and time.monotonic()-r['close_requested_at']<15"
          /usr/bin/python3 -c "import json; assert all(json.load(open('/tmp/shiwen-' + k + '.json'))['ok'] for k in ['core', 'gui'])"
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: shiwen-source
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, linux-compatibility, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving its published assets."
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --prerelease --title "Shiwen $RELEASE_TAG" \
              --notes-file docs/RELEASE_NOTES.md
          fi
      - name: Publish the update feed after packages are available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/asoming/shiwen/releases?per_page=100' > /tmp/shiwen-releases.json
          python scripts/release_feed.py /tmp/shiwen-releases.json /tmp/shiwen-update-feed.json
          git fetch origin main
          git checkout -B update-feed origin/main
          mkdir -p updates
          cp /tmp/shiwen-update-feed.json updates/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh published release feed'
            git push origin HEAD:main
          fi

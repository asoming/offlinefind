[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiwen"
version = "0.1.0b6"
description = "Private, offline full-text search for your documents / 拾文"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "asoming"}]
dependencies = [
  "pypdf==6.19.0",
  "pywebview==6.2.1",
  "platformdirs==4.11.8",
  "watchdog==6.0.0",
  "defusedxml==0.7.1",
  "certifi==2026.7.22",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7", "build==1.6.1", "pyinstaller==6.22.3", "reportlab==5.0.1"]

[project.scripts]
shiwen = "shiwen.app:main"

[project.urls]
Homepage = "https://github.com/asoming/shiwen"
Issues = "https://github.com/asoming/shiwen/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiwen = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
